name: candeweb

services:
  candeweb:
    image: ${DOCKER_IMAGE:-candeweb:local}
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: missing
    init: true
    restart: unless-stopped
    ports:
      - '${CANDEWEB_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      API_HOST: 0.0.0.0
      DATABASE_PATH: /app/data/candemor.db
      UPLOAD_DIR: /app/data/uploads
      SETUP_DIR: /app/data/setups
      BACKUP_DIR: /app/data/backups
      BROWSER_DIR: /app/dist/candeweb/browser
      ADMIN_SETUP_TOKEN: ${ADMIN_SETUP_TOKEN:-}
      WEB_UPDATES_API_TOKEN: ${WEB_UPDATES_API_TOKEN:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://candemor.com}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Candemor Racing Team}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-8000}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      FATCAT_API_BASE_URL: ${FATCAT_API_BASE_URL:-https://fatcatrace.xyz/api/torneo}
      FATCAT_ROUND_BASE_URL: ${FATCAT_ROUND_BASE_URL:-https://fatcatrace.xyz/ronda}
      FATCAT_ORIGIN: ${FATCAT_ORIGIN:-https://fatcatrace.xyz}
    volumes:
      - candeweb-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  candeweb-data:
    name: candeweb-data
