version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*']
        update-types: ['minor', 'patch']
      tooling:
        patterns: ['prettier', 'tailwindcss', '@tailwindcss/*', 'postcss']
        update-types: ['minor', 'patch']
    ignore:
      # Mayores que requieren migración planificada (ver docs/ci-cd-seo.md).
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular-devkit/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: 'jsdom'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'deps'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'deps'
