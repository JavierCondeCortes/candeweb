name: Lighthouse SEO

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start server
        env:
          LH_DATA: ${{ runner.temp }}/lh-data
        run: |
          mkdir -p "$LH_DATA"
          DATABASE_PATH="$LH_DATA/db.sqlite" UPLOAD_DIR="$LH_DATA/uploads" SETUP_DIR="$LH_DATA/setups" \
            PUBLIC_APP_URL=http://localhost:3000 nohup node server/server.mjs > "$LH_DATA/server.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/api/health
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.0 autorun --config=lighthouserc.json
      - name: Stop server
        if: always()
        run: pkill -f "node server/server.mjs" || true
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 7
          if-no-files-found: ignore
