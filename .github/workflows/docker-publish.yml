name: Publish Docker image

on:
  push:
    branches: [Main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Auto-despliegue en producción: solo para pushes a Main (no para tags).
  # Pide a Dokploy que vuelva a descargar la imagen :latest y reinicie el servicio.
  # Requiere el secreto DOKPLOY_DEPLOY_WEBHOOK (URL del webhook del servicio candeweb en Dokploy).
  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/Main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
    steps:
      - name: Disparar redespliegue en Dokploy
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "::error::Falta el secreto DOKPLOY_DEPLOY_WEBHOOK"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 \
            -X POST -H 'Content-Type: application/json' -d '{}' \
            "$DEPLOY_WEBHOOK_URL" > /dev/null
          echo "Redespliegue solicitado a Dokploy."
